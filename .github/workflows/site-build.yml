name: Build website

# Check that every pull request touching the site still builds (both locales).
# Deployment stays in deploy.yml, which only runs on pushes to main.
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/site-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run build
