<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#334155">Interactive World Models</text>
  <text x="60" y="82" font-size="17" fill="#64748B">The model replaces the simulator: every frame is generated on the fly from the player's latest action</text>

  <!-- player / agent -->
  <rect x="60" y="200" width="220" height="150" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="170" y="240" font-size="19" font-weight="700" fill="#F59E0B" text-anchor="middle">Player / Agent</text>
  <text x="170" y="272" font-size="14" fill="#64748B" text-anchor="middle">keyboard, mouse,</text>
  <text x="170" y="292" font-size="14" fill="#64748B" text-anchor="middle">robot command, or a</text>
  <text x="170" y="312" font-size="14" fill="#64748B" text-anchor="middle">learned (latent) action</text>
  <path d="M280,275 L386,275" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#aa)"/>
  <text x="333" y="262" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">a<tspan dy="4" font-size="11">t</tspan></text>

  <!-- world model -->
  <rect x="390" y="150" width="440" height="250" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="610" y="186" font-size="20" font-weight="700" fill="#4F46E5" text-anchor="middle">Action-conditioned generator</text>
  <rect x="415" y="206" width="190" height="78" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="510" y="236" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">short context</text>
  <text x="510" y="260" font-size="13" fill="#64748B" text-anchor="middle">last K frames + actions</text>
  <rect x="615" y="206" width="190" height="78" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="710" y="236" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">long-term memory</text>
  <text x="710" y="260" font-size="13" fill="#64748B" text-anchor="middle">what was seen before</text>
  <rect x="415" y="298" width="390" height="78" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="610" y="328" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">few-step denoiser  or  token decoder</text>
  <text x="610" y="352" font-size="13" fill="#64748B" text-anchor="middle">samples one plausible next frame p(x<tspan dy="3" font-size="9">t+1</tspan><tspan dy="-3"> | x</tspan><tspan dy="3" font-size="9">≤t</tspan><tspan dy="-3">, a</tspan><tspan dy="3" font-size="9">≤t</tspan><tspan dy="-3">)</tspan></text>

  <!-- next frame -->
  <path d="M830,275 L926,275" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ai)"/>
  <rect x="930" y="200" width="290" height="150" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1075" y="240" font-size="19" font-weight="700" fill="#4F46E5" text-anchor="middle">generated frame x̂<tspan dy="4" font-size="12">t+1</tspan></text>
  <g stroke="#4F46E5" stroke-width="1" opacity="0.3">
    <line x1="960" y1="270" x2="1190" y2="270"/><line x1="960" y1="295" x2="1190" y2="295"/><line x1="960" y1="320" x2="1190" y2="320"/>
  </g>
  <circle cx="1040" cy="295" r="14" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1.5"/>

  <!-- feedback loops -->
  <path d="M1075,350 L1075,440 L610,440 L610,404" stroke="#4F46E5" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ai)"/>
  <text x="842" y="462" font-size="14" fill="#4F46E5" text-anchor="middle">fed back as context (autoregressive → drift risk)</text>
  <path d="M1220,275 L1245,275 L1245,120 L170,120 L170,196" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#as)"/>
  <text x="708" y="112" font-size="14" fill="#64748B" text-anchor="middle">shown to the player, who reacts with the next action</text>

  <!-- three requirements -->
  <rect x="60" y="520" width="370" height="140" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="245" y="556" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">1 · Controllability</text>
  <text x="245" y="588" font-size="14" fill="#64748B" text-anchor="middle">different actions must lead</text>
  <text x="245" y="610" font-size="14" fill="#64748B" text-anchor="middle">to different, correct futures</text>
  <rect x="455" y="520" width="370" height="140" rx="14" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="556" font-size="18" font-weight="700" fill="#10B981" text-anchor="middle">2 · Real time</text>
  <text x="640" y="588" font-size="14" fill="#64748B" text-anchor="middle">at 24 fps the whole denoising loop</text>
  <text x="640" y="610" font-size="14" fill="#64748B" text-anchor="middle">has ≈ 42 ms per frame</text>
  <rect x="850" y="520" width="370" height="140" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="1035" y="556" font-size="18" font-weight="700" fill="#EF4444" text-anchor="middle">3 · Consistency</text>
  <text x="1035" y="588" font-size="14" fill="#64748B" text-anchor="middle">turn around and come back:</text>
  <text x="1035" y="610" font-size="14" fill="#64748B" text-anchor="middle">the same place should still be there</text>
</svg>
