<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#334155">Video World Models</text>
  <text x="60" y="82" font-size="17" fill="#64748B">Given real context frames and actions, the model generates future frames — and errors compound over time</text>

  <!-- context frames (real) -->
  <g>
    <rect x="60" y="220" width="150" height="120" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <rect x="230" y="220" width="150" height="120" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <rect x="400" y="220" width="150" height="120" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <rect x="570" y="220" width="150" height="120" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <g stroke="#10B981" stroke-width="1" opacity="0.4">
      <line x1="60" y1="280" x2="210" y2="280"/><line x1="230" y1="280" x2="380" y2="280"/>
      <line x1="400" y1="280" x2="550" y2="280"/><line x1="570" y1="280" x2="720" y2="280"/>
    </g>
    <g font-size="16" font-weight="700" fill="#10B981" text-anchor="middle">
      <text x="135" y="368">t1</text><text x="305" y="368">t2</text><text x="475" y="368">t3</text><text x="645" y="368">t4</text>
    </g>
  </g>
  <!-- generated frames (dashed) -->
  <g>
    <rect x="740" y="220" width="150" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="910" y="220" width="150" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="1080" y="220" width="150" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
    <g stroke="#4F46E5" stroke-width="1" opacity="0.3">
      <line x1="740" y1="280" x2="890" y2="280"/><line x1="910" y1="280" x2="1060" y2="280"/><line x1="1080" y1="280" x2="1230" y2="280"/>
    </g>
    <g font-size="16" font-weight="700" fill="#4F46E5" text-anchor="middle">
      <text x="815" y="368">t5</text><text x="985" y="368">t6</text><text x="1155" y="368">t7</text>
    </g>
  </g>
  <!-- boundary arrow -->
  <path d="M720,280 L736,280" stroke="#64748B" stroke-width="2" marker-end="url(#as)"/>
  <text x="135" y="410" font-size="14" fill="#10B981">observed context (real video)</text>
  <text x="815" y="410" font-size="14" fill="#4F46E5">imagined future (generated)</text>

  <!-- conditioning -->
  <rect x="60" y="470" width="300" height="64" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="210" y="498" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">action-conditioned</text>
  <text x="210" y="522" font-size="13" fill="#64748B" text-anchor="middle">future frames depend on chosen actions a<tspan dy="3" font-size="9">t</tspan></text>
  <rect x="400" y="470" width="300" height="64" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="550" y="498" font-size="16" font-weight="700" fill="#4F46E5" text-anchor="middle">generation machinery</text>
  <text x="550" y="522" font-size="13" fill="#64748B" text-anchor="middle">autoregressive tokens or diffusion</text>
  <path d="M360,502 L396,502" stroke="#64748B" stroke-width="2" marker-end="url(#as)"/>

  <!-- drift plot -->
  <rect x="800" y="450" width="420" height="220" rx="12" fill="#FAFAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="840" y1="630" x2="1180" y2="630" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="840" y1="630" x2="840" y2="480" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1180" y="656" font-size="13" fill="#64748B" text-anchor="end">prediction horizon →</text>
  <text x="830" y="476" font-size="13" fill="#64748B" text-anchor="end">error</text>
  <path d="M840,610 C920,600 1000,570 1060,520 S1140,480 1180,478" stroke="#EF4444" stroke-width="2.5" fill="none"/>
  <path d="M840,616 C930,608 1020,584 1080,544 S1150,510 1180,505" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="1010" y="500" font-size="14" font-weight="600" fill="#EF4444">drift: small errors compound</text>
</svg>
