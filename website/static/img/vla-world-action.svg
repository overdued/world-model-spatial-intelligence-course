<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#334155">VLA vs World–Action Models</text>
  <text x="60" y="82" font-size="17" fill="#64748B">Two routes from perception and instruction to robot action: direct mapping, or model-predicted consequences</text>

  <!-- shared inputs -->
  <rect x="60" y="220" width="200" height="110" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <g stroke="#10B981" stroke-width="1" opacity="0.5">
    <line x1="60" y1="257" x2="260" y2="257"/><line x1="60" y1="293" x2="260" y2="293"/>
    <line x1="127" y1="220" x2="127" y2="330"/><line x1="193" y1="220" x2="193" y2="330"/>
  </g>
  <text x="160" y="356" font-size="15" font-weight="600" fill="#10B981" text-anchor="middle">camera image</text>
  <rect x="60" y="390" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="160" y="422" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">language instruction</text>
  <text x="160" y="446" font-size="14" fill="#64748B" text-anchor="middle">"pick up the cup"</text>

  <!-- inputs merge -->
  <path d="M260,275 C300,275 300,300 336,300" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#as)"/>
  <path d="M260,430 C300,430 300,312 336,304" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#as)"/>

  <!-- VLA model (direct) -->
  <rect x="340" y="240" width="240" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="460" y="282" font-size="21" font-weight="700" fill="#4F46E5" text-anchor="middle">VLA model</text>
  <text x="460" y="310" font-size="14" fill="#64748B" text-anchor="middle">vision–language–action</text>
  <text x="460" y="334" font-size="14" fill="#64748B" text-anchor="middle">direct mapping to action</text>
  <path d="M580,305 L660,305" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="620" y="290" font-size="14" font-weight="600" fill="#F59E0B" text-anchor="middle">action</text>

  <!-- World-action branch (below) -->
  <rect x="340" y="470" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="460" y="510" font-size="19" font-weight="700" fill="#4F46E5" text-anchor="middle">World model</text>
  <text x="460" y="538" font-size="14" fill="#64748B" text-anchor="middle">predicts consequence</text>
  <text x="460" y="560" font-size="14" fill="#64748B" text-anchor="middle">of candidate actions</text>
  <path d="M460,370 C460,420 460,430 460,466" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#as)"/>
  <path d="M580,525 L660,525" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ai)"/>
  <rect x="670" y="485" width="190" height="80" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="765" y="517" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">action selection</text>
  <text x="765" y="541" font-size="13" fill="#64748B" text-anchor="middle">best predicted outcome</text>
  <path d="M765,485 C765,420 700,340 664,314" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#am)"/>

  <!-- merge to robot -->
  <path d="M660,305 C760,305 820,340 900,352" stroke="#F59E0B" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
  <rect x="910" y="290" width="300" height="150" rx="12" fill="#FAFAFC" stroke="#334155" stroke-width="2"/>
  <text x="1060" y="330" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Robot actuator</text>
  <!-- simple robot arm icon -->
  <g stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="1000" y1="410" x2="1040" y2="375"/>
    <line x1="1040" y1="375" x2="1090" y2="390"/>
    <line x1="1090" y1="390" x2="1115" y2="370"/>
  </g>
  <circle cx="1040" cy="375" r="6" fill="#334155"/>
  <circle cx="1090" cy="390" r="6" fill="#334155"/>
  <rect x="980" y="410" width="40" height="14" rx="4" fill="#334155"/>

  <!-- comparison note -->
  <rect x="60" y="560" width="520" height="100" rx="12" fill="#FAFAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="592" font-size="15" font-weight="700" fill="#334155">VLA: fast, end-to-end — but reactive</text>
  <text x="320" y="618" font-size="14" fill="#64748B">World–action: slower per decision, but can weigh</text>
  <text x="320" y="640" font-size="14" fill="#64748B">consequences before committing to an action</text>
</svg>
