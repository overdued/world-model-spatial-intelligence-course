<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#334155">Spatial Memory</text>
  <text x="60" y="82" font-size="17" fill="#64748B">Observations along a trajectory consolidate into a persistent, layered scene representation</text>

  <!-- left: room with trajectory timeline -->
  <rect x="60" y="150" width="520" height="380" rx="12" fill="#FAFAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="320" y="184" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">agent explores a room over time</text>
  <!-- room sketch -->
  <rect x="100" y="210" width="440" height="270" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="130" y="240" width="80" height="50" rx="6" fill="#F59E0B" opacity="0.35"/>
  <text x="170" y="270" font-size="12" fill="#64748B" text-anchor="middle">table</text>
  <rect x="420" y="380" width="90" height="70" rx="6" fill="#10B981" opacity="0.3"/>
  <text x="465" y="420" font-size="12" fill="#64748B" text-anchor="middle">sofa</text>
  <circle cx="400" cy="250" r="20" fill="#EF4444" opacity="0.3"/>
  <text x="400" y="254" font-size="12" fill="#64748B" text-anchor="middle">lamp</text>
  <!-- trajectory -->
  <path d="M150,430 C220,400 240,340 300,330 S420,300 470,310" stroke="#4F46E5" stroke-width="2.5" fill="none" marker-end="url(#ai)"/>
  <g fill="#4F46E5">
    <circle cx="150" cy="430" r="7"/><circle cx="300" cy="330" r="7"/><circle cx="470" cy="310" r="7"/>
  </g>
  <g font-size="13" font-weight="600" fill="#4F46E5" text-anchor="middle">
    <text x="150" y="456">t₁</text><text x="300" y="312">t₂</text><text x="470" y="292">t₃</text>
  </g>
  <text x="320" y="512" font-size="13" fill="#64748B" text-anchor="middle">each step contributes new observations of the same persistent scene</text>

  <!-- arrows to memory -->
  <path d="M580,300 L660,300" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M580,380 L660,380" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M580,460 L660,460" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <text x="620" y="270" font-size="13" fill="#64748B" text-anchor="middle">observations</text>
  <text x="620" y="288" font-size="13" fill="#64748B" text-anchor="middle">update layers</text>

  <!-- right: memory stack -->
  <text x="920" y="150" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">persistent spatial memory</text>
  <!-- layer 1: map/geometry -->
  <rect x="680" y="180" width="480" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="710" y="214" font-size="17" font-weight="700" fill="#4F46E5">Geometry layer</text>
  <text x="710" y="240" font-size="14" fill="#64748B">occupancy map / metric layout — where free space and walls are</text>
  <g stroke="#4F46E5" stroke-width="1.2" opacity="0.5">
    <line x1="1000" y1="200" x2="1140" y2="200"/><line x1="1000" y1="220" x2="1120" y2="220"/><line x1="1000" y1="240" x2="1140" y2="240"/><line x1="1000" y1="260" x2="1100" y2="260"/>
  </g>
  <!-- layer 2: objects -->
  <rect x="680" y="310" width="480" height="110" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="710" y="344" font-size="17" font-weight="700" fill="#10B981">Object layer</text>
  <text x="710" y="370" font-size="14" fill="#64748B">persistent object instances with poses — the table is still there when unseen</text>
  <rect x="1000" y="330" width="40" height="30" rx="4" fill="#F59E0B" opacity="0.4"/>
  <rect x="1060" y="345" width="50" height="40" rx="4" fill="#10B981" opacity="0.35"/>
  <circle cx="1130" cy="350" r="14" fill="#EF4444" opacity="0.35"/>
  <!-- layer 3: semantics -->
  <rect x="680" y="440" width="480" height="110" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="710" y="474" font-size="17" font-weight="700" fill="#F59E0B">Semantic layer</text>
  <text x="710" y="500" font-size="14" fill="#64748B">room labels, affordances, language grounding — "kitchen", "sit-able", "openable"</text>
  <rect x="1000" y="460" width="90" height="34" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1045" y="482" font-size="13" fill="#334155" text-anchor="middle">"kitchen"</text>
  <rect x="1100" y="460" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1130" y="482" font-size="13" fill="#334155" text-anchor="middle">"sit"</text>

  <!-- update note -->
  <rect x="680" y="590" width="480" height="80" rx="12" fill="#FAFAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="920" y="622" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">new observations update the matching layer;</text>
  <text x="920" y="648" font-size="15" fill="#334155" text-anchor="middle">memory persists even when things leave the field of view</text>
</svg>
